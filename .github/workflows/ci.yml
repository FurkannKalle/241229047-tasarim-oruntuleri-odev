name: Notification System CI

on:
  push:
    branches: [ "main", "phase-3" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python 3.10
      uses: actions/setup-python@v3
      with:
        python-version: "3.10"
        
    - name: Syntax Check
      run: |
        echo "Kodun soz dizimi kontrol ediliyor "
        python -m py_compile src/notification_system.py
        echo "Kontrol basarili "